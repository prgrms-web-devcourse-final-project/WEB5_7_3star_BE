services:
  redis-core:
    image: redis:7-alpine
    container_name: redis-core
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-core-data:/data
    # Core Redis: 재고/대기열 복구를 위해 AOF 유지
    command: redis-server --appendonly yes
    networks:
      - redis-network

  redis-mq:
    image: redis:7-alpine
    container_name: redis-mq
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - ./redis-mq-data:/data
    # MQ Redis: 고부하 처리 안정성을 위해 영속화 비활성화
    command: redis-server --appendonly no --save ""
    networks:
      - redis-network

networks:
  redis-network:
    driver: bridge

volumes:
  redis-core-data:
  redis-mq-data:
