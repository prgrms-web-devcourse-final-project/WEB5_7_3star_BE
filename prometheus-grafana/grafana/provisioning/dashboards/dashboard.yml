apiVersion: 1

providers:
  - name: 'TrainUs Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards # JSON 파일들이 실제로 마운트된 경로
      foldersFromFilesStructure: true
