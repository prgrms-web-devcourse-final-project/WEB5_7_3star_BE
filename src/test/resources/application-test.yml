spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trainus_test}
    username: ${DB_USER:trainus}
    password: ${DB_PASSWORD:trainus}

  page:
    size:
      limit: 5

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      core:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
      mq:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: false
      key:
        prefix: "redis://"

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: true
        use_sql_comments: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@example.com}
    password: ${MAIL_PASSWORD:test-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:test-access-key}
      secret-key: ${AWS_SECRET_KEY:test-secret-key}
    s3:
      bucket: ${S3_BUCKET_NAME:test-bucket}
    region:
      static: ap-northeast-2
    stack:
      auto: false

logging:
  file:
    name: logs/test.log
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.orm.jpa: ERROR

payment:
  secret-key: ${PAYMENT_SECRET_KEY:test-payment-secret}
  base-url: https://api.tosspayments.com
  confirm-endpoint: /v1/payments/confirm
  cancel-endpoint: /v1/payments/%s/cancel

jwt:
  secret: ${JWT_SECRET:test-jwt-secret-key-for-integration-tests-1234567890}
  access-token-validity: 3600000
  refresh-token-validity: 604800000
