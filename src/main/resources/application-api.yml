server:
  port: 8080

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    tags:
      application: trainus
      role: api

spring:
  data:
    redis:
      core:
        host: ${REDIS_CORE_HOST:localhost}
        port: ${REDIS_CORE_PORT:6379}
        lettuce:
          pool:
            max-active: 30
            max-idle: 15
            min-idle: 5
            max-wait: 3000ms
      mq:
        host: ${REDIS_MQ_HOST:localhost}
        port: ${REDIS_MQ_PORT:6380}
        lettuce:
          pool:
            max-active: 30
            max-idle: 15
            min-idle: 5
            max-wait: 3000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  page:
    size:
      limit: 5
